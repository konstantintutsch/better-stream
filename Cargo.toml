[package]
name = "better-stream"
version = "0.1.0"
edition = "2024"
description = "A multi-stream RTSP viewer for quick glances detecting frozen streams."
readme = "README.md"
license-file = "LICENSE.txt"
repository = "https://github.com/konstantintutsch/better-stream"

[dependencies]
tokio = { version = ">=1.49.0", features = ["full"] }
iced = { version = ">=0.14.0", features = ["advanced", "image"] }
retina = ">=0.4.0"
log = "0.4.29"
env_logger = "0.11.8"
ffmpeg-next = { version = ">=9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
serde = { version = ">=1.0.229", features = ["derive"] }
toml = ">=1.1.8"
dirs = ">=7.0.0"
url = ">=2.5.8"
